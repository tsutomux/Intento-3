name: Crear App Xbox Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Crear archivos UWP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path AppFolder
          New-Item -ItemType Directory -Force -Path AppFolder\Assets

          $files = @{}

          $files["AppFolder\App.xaml"] = @"
          <Application x:Class="XboxCloudApp.App" xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation" xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml">
          <Application.Resources>
          </Application.Resources>
          </Application>
          "@

          $files["AppFolder\App.xaml.cs"] = @"
          using Windows.ApplicationModel.Activation;
          using Windows.UI.Xaml;
          using Windows.UI.Xaml.Controls;

          namespace XboxCloudApp
          {
              sealed partial class App : Application
              {
                  public App()
                  {
                      InitializeComponent();
                  }

                  protected override void OnLaunched(LaunchActivatedEventArgs e)
                  {
                      Frame frame = Window.Current.Content as Frame;

                      if (frame == null)
                      {
                          frame = new Frame();
                          Window.Current.Content = frame;
                      }

                      if (frame.Content == null)
                      {
                          frame.Navigate(typeof(MainPage));
                      }

                      Window.Current.Activate();
                  }
              }
          }
          "@

          $files["AppFolder\MainPage.xaml"] = @"
          <Page x:Class="XboxCloudApp.MainPage" xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation" xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml">
          <Grid Background="Black">
          <WebView x:Name="Browser" HorizontalAlignment="Stretch" VerticalAlignment="Stretch"/>
          </Grid>
          </Page>
          "@

          $files["AppFolder\MainPage.xaml.cs"] = @"
          using System;
          using Windows.UI.Xaml;
          using Windows.UI.Xaml.Controls;

          namespace XboxCloudApp
          {
              public sealed partial class MainPage : Page
              {
                  public MainPage()
                  {
                      InitializeComponent();
                      Loaded += MainPage_Loaded;
                  }

                  private void MainPage_Loaded(object sender, RoutedEventArgs e)
                  {
                      Browser.NewWindowRequested += Browser_NewWindowRequested;
                      Browser.Navigate(new Uri("https://www.xbox.com/play"));
                  }

                  private void Browser_NewWindowRequested(
                      WebView sender,
                      WebViewNewWindowRequestedEventArgs args)
                  {
                      args.Handled = true;

                      if (!string.IsNullOrEmpty(args.Uri))
                      {
                          Browser.Navigate(new Uri(args.Uri));
                      }
                  }
              }
          }
          "@

          $files["AppFolder\XboxCloudApp.csproj"] = @"
          <Project ToolsVersion="15.0" DefaultTargets="Build" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <PropertyGroup>
              <Configuration Condition="'`$(Configuration)' == ''">Release</Configuration>
              <Platform Condition="'`$(Platform)' == ''">x64</Platform>
              <ProjectGuid>{A6E6A8D7-5C1A-4E9D-9A71-1C6F1A8C5521}</ProjectGuid>
              <OutputType>AppContainerExe</OutputType>
              <RootNamespace>XboxCloudApp</RootNamespace>
              <AssemblyName>XboxCloudApp</AssemblyName>
              <TargetPlatformIdentifier>UAP</TargetPlatformIdentifier>
              <TargetPlatformVersion>10.0.26100.0</TargetPlatformVersion>
              <TargetPlatformMinVersion>10.0.17763.0</TargetPlatformMinVersion>
              <DefaultLanguage>es-ES</DefaultLanguage>
              <MinimumVisualStudioVersion>16.0</MinimumVisualStudioVersion>
              <AppxPackageSigningEnabled>false</AppxPackageSigningEnabled>
              <Platforms>x64</Platforms>
            </PropertyGroup>

            <ItemGroup>
              <ApplicationDefinition Include="App.xaml">
                <Generator>MSBuild:Compile</Generator>
                <SubType>Designer</SubType>
              </ApplicationDefinition>

              <Page Include="MainPage.xaml">
                <Generator>MSBuild:Compile</Generator>
                <SubType>Designer</SubType>
              </Page>

              <Compile Include="App.xaml.cs">
                <DependentUpon>App.xaml</DependentUpon>
              </Compile>

              <Compile Include="MainPage.xaml.cs">
                <DependentUpon>MainPage.xaml</DependentUpon>
              </Compile>
            </ItemGroup>

            <Import Project="`$(MSBuildToolsPath)\Microsoft.CSharp.targets" />

            <Import Project="`$(MSBuildExtensionsPath)\Microsoft\WindowsXaml\v`$(VisualStudioVersion)\Microsoft.Windows.UI.Xaml.CSharp.targets"
                    Condition="Exists('`$(MSBuildExtensionsPath)\Microsoft\WindowsXaml\v`$(VisualStudioVersion)\Microsoft.Windows.UI.Xaml.CSharp.targets')" />

          </Project>
          "@

          $files["AppFolder\AppxManifest.xml"] = @"
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10">
            <Identity Name="XboxCloudApp" Publisher="CN=XboxCloudApp" Version="1.0.0.0"/>
            <Properties>
              <DisplayName>Xbox Cloud Gaming</DisplayName>
              <PublisherDisplayName>David</PublisherDisplayName>
              <Logo>Assets\logo.png</Logo>
            </Properties>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Xbox" MinVersion="10.0.17763.0" MaxVersionTested="10.0.26100.0"/>
            </Dependencies>
            <Resources>
              <Resource Language="es-ES"/>
            </Resources>
            <Applications>
              <Application Id="App" Executable="`$targetnametoken`$.exe" EntryPoint="XboxCloudApp.App">
                <uap:VisualElements DisplayName="Xbox Cloud Gaming" Description="Xbox Cloud Gaming" BackgroundColor="#107C10" Square150x150Logo="Assets\logo.png" Square44x44Logo="Assets\logo.png"/>
              </Application>
            </Applications>
            <Capabilities>
              <Capability Name="internetClient"/>
            </Capabilities>
          </Package>
          "@

          foreach ($item in $files.GetEnumerator()) {
              $directory = Split-Path $item.Key -Parent

              if ($directory) {
                  New-Item -ItemType Directory -Force -Path $directory | Out-Null
              }

              Set-Content -Path $item.Key -Value $item.Value -Encoding UTF8
          }

          $png = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="

          [IO.File]::WriteAllBytes(
              "AppFolder\Assets\logo.png",
              [Convert]::FromBase64String($png)
          )

      - name: Compilar UWP
        shell: pwsh
        run: |
          msbuild AppFolder\XboxCloudApp.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxPackageSigningEnabled=false `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /verbosity:minimal

      - name: Empaquetar
        shell: cmd
        run: |
          makeappx pack /d AppFolder /p XboxCloudApp.appx /o

      - name: Crear certificado
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=XboxCloudApp" `
            -KeyUsage DigitalSignature `
            -FriendlyName "XboxCloudApp" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @(
              "2.5.29.37={text}1.3.6.1.5.5.7.3.3",
              "2.5.29.19={text}"
            )

          $password = ConvertTo-SecureString "1234" -AsPlainText -Force

          Export-PfxCertificate `
            -Cert $cert `
            -FilePath XboxCloudApp.pfx `
            -Password $password

          Export-Certificate `
            -Cert $cert `
            -FilePath XboxCloudApp.cer

      - name: Firmar
        shell: cmd
        run: |
          signtool sign /fd SHA256 /a /f XboxCloudApp.pfx /p 1234 XboxCloudApp.appx

      - name: Subir aplicación
        uses: actions/upload-artifact@v4
        with:
          name: Xbox-App-Terminada
          path: |
            XboxCloudApp.appx
            XboxCloudApp.cer
