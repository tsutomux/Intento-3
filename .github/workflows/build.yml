"@ | Set-Content `
          "XboxCloudApp\AppxManifest.xml" `
          -Encoding UTF8


    # ==========================================================
    # RESTAURAR NUGET
    # ==========================================================

    - name: Restaurar paquetes NuGet
      shell: pwsh
      run: |
        dotnet restore XboxCloudApp\XboxCloudApp.csproj


    # ==========================================================
    # COMPILAR
    # ==========================================================

    - name: Compilar UWP
      shell: pwsh
      run: |

        msbuild XboxCloudApp\XboxCloudApp.csproj `
          /restore `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:AppxPackageSigningEnabled=false `
          /p:UapAppxPackageBuildMode=SideloadOnly `
          /p:AppxBundle=Never `
          /verbosity:minimal


    # ==========================================================
    # MOSTRAR ARCHIVOS GENERADOS
    # ==========================================================

    - name: Buscar AppX generado
      shell: pwsh
      run: |

        Write-Host "===== ARCHIVOS APPX ====="

        Get-ChildItem `
          -Path . `
          -Recurse `
          -Include *.appx,*.msix |
          Select-Object FullName


    # ==========================================================
    # LOCALIZAR APPX
    # ==========================================================

    - name: Copiar AppX
      shell: pwsh
      run: |

        $appx = Get-ChildItem `
          -Path . `
          -Recurse `
          -Filter *.appx |
          Where-Object {
            $_.FullName -notlike "*\obj\*" -and
            $_.FullName -notlike "*\bin\*" -eq $false
          } |
          Select-Object -First 1

        if (-not $appx)
        {
            $appx = Get-ChildItem `
              -Path . `
              -Recurse `
              -Filter *.appx |
              Select-Object -First 1
        }

        if (-not $appx)
        {
            Write-Error "NO SE ENCONTRO NINGUN APPX"
            exit 1
        }

        Copy-Item `
          $appx.FullName `
          "XboxCloudApp.appx" `
          -Force

        Write-Host "AppX encontrado:"
        Write-Host $appx.FullName


    # ==========================================================
    # CREAR CERTIFICADO
    # ==========================================================

    - name: Generar certificado
      shell: pwsh
      run: |

        $cert = New-SelfSignedCertificate `
          -Type Custom `
          -Subject "CN=XboxCloudApp" `
          -KeyUsage DigitalSignature `
          -FriendlyName "XboxCloudApp" `
          -CertStoreLocation "Cert:\CurrentUser\My" `
          -TextExtension @(
            "2.5.29.37={text}1.3.6.1.5.5.7.3.3",
            "2.5.29.19={text}"
          )

        $pwd = ConvertTo-SecureString `
          "1234" `
          -Force `
          -AsPlainText

        Export-PfxCertificate `
          -Cert $cert `
          -FilePath "XboxCloudApp.pfx" `
          -Password $pwd

        Export-Certificate `
          -Cert $cert `
          -FilePath "XboxCloudApp.cer"


    # ==========================================================
    # FIRMAR APPX
    # ==========================================================

    - name: Firmar AppX
      shell: cmd
      run: |

        signtool sign ^
          /fd SHA256 ^
          /a ^
          /f XboxCloudApp.pfx ^
          /p 1234 ^
          XboxCloudApp.appx


    # ==========================================================
    # SUBIR RESULTADOS
    # ==========================================================

    - name: Subir AppX
      uses: actions/upload-artifact@v4

      with:

        name: Xbox-App-WebView2

        path: |
          XboxCloudApp.appx
          XboxCloudApp.cer
          XboxCloudApp.pfx
