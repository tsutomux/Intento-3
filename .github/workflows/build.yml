name: Crear App Xbox Cloud

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Configurar entorno de Windows
      uses: ilammy/msvc-dev-cmd@v1

    - name: Crear estructura y archivos
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "AppFolder"
        New-Item -ItemType Directory -Force -Path "AppFolder\Assets"

        # Icono PNG mínimo válido
        $bytes = [Convert]::FromBase64String("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=")
        [IO.File]::WriteAllBytes("AppFolder\Assets\logo.png", $bytes)

        # Manifiesto
        $manifest = @"
        <?xml version="1.0" encoding="utf-8"?>
        <Package
          xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
          xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10">

          <Identity
            Name="XboxCloudApp"
            Publisher="CN=XboxCloudApp"
            Version="1.0.0.0" />

          <Properties>
            <DisplayName>Xbox Cloud</DisplayName>
            <PublisherDisplayName>David</PublisherDisplayName>
            <Logo>Assets\logo.png</Logo>
          </Properties>

          <Dependencies>
            <TargetDeviceFamily
              Name="Windows.Universal"
              MinVersion="10.0.17763.0"
              MaxVersionTested="10.0.26100.0" />
          </Dependencies>

          <Resources>
            <Resource Language="es-ES" />
          </Resources>

          <Applications>
            <Application
              Id="App"
              StartPage="https://www.xbox.com/play">

              <uap:VisualElements
                DisplayName="Xbox Cloud Gaming"
                Description="Xbox Cloud Gaming"
                BackgroundColor="#107C10"
                Square150x150Logo="Assets\logo.png"
                Square44x44Logo="Assets\logo.png" />

              <uap:ApplicationContentUriRules>

                <!-- Xbox -->
                <uap:Rule
                  Match="https://www.xbox.com/"
                  Type="include"
                  WindowsRuntimeAccess="all" />

                <!-- Cuenta Microsoft -->
                <uap:Rule
                  Match="https://login.live.com/"
                  Type="include"
                  WindowsRuntimeAccess="none" />

                <!-- Cuenta Microsoft -->
                <uap:Rule
                  Match="https://account.microsoft.com/"
                  Type="include"
                  WindowsRuntimeAccess="none" />

                <!-- Microsoft -->
                <uap:Rule
                  Match="https://www.microsoft.com/"
                  Type="include"
                  WindowsRuntimeAccess="none" />

                <!-- Xbox Live -->
                <uap:Rule
                  Match="https://xboxlive.com/"
                  Type="include"
                  WindowsRuntimeAccess="none" />

              </uap:ApplicationContentUriRules>

            </Application>
          </Applications>

          <Capabilities>
            <Capability Name="internetClient" />
          </Capabilities>

        </Package>
        "@

        Set-Content `
          -Path "AppFolder\AppxManifest.xml" `
          -Value $manifest `
          -Encoding UTF8

    - name: Comprobar manifiesto
      shell: pwsh
      run: |
        Write-Host "===== AppxManifest.xml ====="
        Get-Content "AppFolder\AppxManifest.xml"

    - name: Empaquetar App
      shell: cmd
      run: |
        makeappx pack /d AppFolder /p XboxCloudApp.appx /o

    - name: Generar Certificado Digital
      shell: pwsh
      run: |
        $cert = New-SelfSignedCertificate `
          -Type Custom `
          -Subject "CN=XboxCloudApp" `
          -KeyUsage DigitalSignature `
          -FriendlyName "XboxCloudApp" `
          -CertStoreLocation "Cert:\CurrentUser\My" `
          -TextExtension @(
            "2.5.29.37={text}1.3.6.1.5.5.7.3.3",
            "2.5.29.19={text}"
          )

        $pwd = ConvertTo-SecureString "1234" -Force -AsPlainText

        Export-PfxCertificate `
          -Cert $cert `
          -FilePath "XboxCloudApp.pfx" `
          -Password $pwd

        Export-Certificate `
          -Cert $cert `
          -FilePath "XboxCloudApp.cer"

    - name: Firmar App
      shell: cmd
      run: |
        signtool sign ^
          /fd SHA256 ^
          /a ^
          /f XboxCloudApp.pfx ^
          /p 1234 ^
          XboxCloudApp.appx

    - name: Subir archivos listos
      uses: actions/upload-artifact@v4
      with:
        name: Xbox-App-Terminada
        path: |
          XboxCloudApp.appx
          XboxCloudApp.cer
