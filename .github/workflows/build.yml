name: Crear App Xbox Cloud WebView2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Crear estructura
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path AppFolder
          New-Item -ItemType Directory -Force -Path AppFolder\Assets

          $bytes = [Convert]::FromBase64String("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=")

          [IO.File]::WriteAllBytes(
            "AppFolder\Assets\logo.png",
            $bytes
          )

      - name: Crear proyecto
        shell: pwsh
        run: |
          @'
          <Project Sdk="Microsoft.NET.Sdk">

            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net8.0-windows10.0.19041.0</TargetFramework>
              <TargetPlatformMinVersion>10.0.17763.0</TargetPlatformMinVersion>
              <RootNamespace>XboxCloudApp</RootNamespace>
              <ApplicationManifest>AppxManifest.xml</ApplicationManifest>
              <Platforms>x64</Platforms>
              <RuntimeIdentifier>win-x64</RuntimeIdentifier>
            </PropertyGroup>

            <ItemGroup>
              <PackageReference Include="Microsoft.Windows.SDK.BuildTools" Version="10.0.26100.3916" />
              <PackageReference Include="Microsoft.Web.WebView2" Version="1.0.3537.50" />
            </ItemGroup>

          </Project>
          '@ | Set-Content AppFolder\XboxCloudApp.csproj -Encoding UTF8

      - name: Crear App.xaml
        shell: pwsh
        run: |
          @'
          <Application
              x:Class="XboxCloudApp.App"
              xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
              xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml">

              <Application.Resources>
              </Application.Resources>

          </Application>
          '@ | Set-Content AppFolder\App.xaml -Encoding UTF8

      - name: Crear App.xaml.cs
        shell: pwsh
        run: |
          @'
          using Windows.ApplicationModel.Activation;
          using Windows.UI.Xaml;

          namespace XboxCloudApp
          {
              sealed partial class App : Application
              {
                  public App()
                  {
                      InitializeComponent();
                  }

                  protected override void OnLaunched(
                      LaunchActivatedEventArgs e)
                  {
                      var frame = Window.Current.Content as Windows.UI.Xaml.Controls.Frame;

                      if (frame == null)
                      {
                          frame = new Windows.UI.Xaml.Controls.Frame();
                          Window.Current.Content = frame;
                      }

                      if (frame.Content == null)
                      {
                          frame.Navigate(typeof(MainPage));
                      }

                      Window.Current.Activate();
                  }
              }
          }
          '@ | Set-Content AppFolder\App.xaml.cs -Encoding UTF8

      - name: Crear MainPage.xaml
        shell: pwsh
        run: |
          @'
          <Page
              x:Class="XboxCloudApp.MainPage"
              xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
              xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml">

              <Grid Background="Black">

                  <WebView
                      x:Name="Browser"
                      HorizontalAlignment="Stretch"
                      VerticalAlignment="Stretch" />

              </Grid>

          </Page>
          '@ | Set-Content AppFolder\MainPage.xaml -Encoding UTF8

      - name: Crear MainPage.xaml.cs
        shell: pwsh
        run: |
          @'
          using System;
          using Windows.UI.Xaml;
          using Windows.UI.Xaml.Controls;

          namespace XboxCloudApp
          {
              public sealed partial class MainPage : Page
              {
                  public MainPage()
                  {
                      InitializeComponent();

                      Loaded += MainPage_Loaded;
                  }

                  private void MainPage_Loaded(
                      object sender,
                      RoutedEventArgs e)
                  {
                      Browser.NavigationStarting += Browser_NavigationStarting;

                      Browser.Navigate(
                          new Uri("https://www.xbox.com/play"));
                  }

                  private void Browser_NavigationStarting(
                      WebView sender,
                      WebViewNavigationStartingEventArgs args)
                  {
                      System.Diagnostics.Debug.WriteLine(
                          "Navegando a: " + args.Uri);
                  }
              }
          }
          '@ | Set-Content AppFolder\MainPage.xaml.cs -Encoding UTF8

      - name: Crear manifiesto
        shell: pwsh
        run: |
          @'
          <?xml version="1.0" encoding="utf-8"?>

          <Package
            xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
            xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10">

            <Identity
              Name="XboxCloudApp"
              Publisher="CN=XboxCloudApp"
              Version="1.0.0.0" />

            <Properties>
              <DisplayName>Xbox Cloud Gaming</DisplayName>
              <PublisherDisplayName>David</PublisherDisplayName>
              <Logo>Assets\logo.png</Logo>
            </Properties>

            <Dependencies>
              <TargetDeviceFamily
                Name="Windows.Universal"
                MinVersion="10.0.17763.0"
                MaxVersionTested="10.0.26100.0" />
            </Dependencies>

            <Resources>
              <Resource Language="es-ES" />
            </Resources>

            <Applications>

              <Application
                Id="App"
                Executable="$targetnametoken$.exe"
                EntryPoint="XboxCloudApp.App">

                <uap:VisualElements
                  DisplayName="Xbox Cloud Gaming"
                  Description="Xbox Cloud Gaming"
                  BackgroundColor="#107C10"
                  Square150x150Logo="Assets\logo.png"
                  Square44x44Logo="Assets\logo.png" />

              </Application>

            </Applications>

            <Capabilities>
              <Capability Name="internetClient" />
            </Capabilities>

          </Package>
          '@ | Set-Content AppFolder\AppxManifest.xml -Encoding UTF8

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar proyecto
        shell: pwsh
        run: |
          dotnet restore AppFolder\XboxCloudApp.csproj

      - name: Compilar
        shell: pwsh
        run: |
          dotnet build AppFolder\XboxCloudApp.csproj `
            --configuration Release `
            --runtime win-x64 `
            --no-restore

      - name: Mostrar resultado
        shell: pwsh
        run: |
          Write-Host "===== RESULTADO ====="
          Get-ChildItem AppFolder -Recurse |
            Select-Object FullName

      - name: Empaquetar AppX
        shell: cmd
        run: |
          makeappx pack /d AppFolder /p XboxCloudApp.appx /o

      - name: Generar certificado
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=XboxCloudApp" `
            -KeyUsage DigitalSignature `
            -FriendlyName "XboxCloudApp" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @(
              "2.5.29.37={text}1.3.6.1.5.5.7.3.3",
              "2.5.29.19={text}"
            )

          $pwd = ConvertTo-SecureString "1234" -Force -AsPlainText

          Export-PfxCertificate `
            -Cert $cert `
            -FilePath XboxCloudApp.pfx `
            -Password $pwd

          Export-Certificate `
            -Cert $cert `
            -FilePath XboxCloudApp.cer

      - name: Firmar AppX
        shell: cmd
        run: |
          signtool sign ^
            /fd SHA256 ^
            /a ^
            /f XboxCloudApp.pfx ^
            /p 1234 ^
            XboxCloudApp.appx

      - name: Subir AppX
        uses: actions/upload-artifact@v4
        with:
          name: Xbox-App-WebView
          path: |
            XboxCloudApp.appx
            XboxCloudApp.cer
