name: Crear App Xbox Cloud

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Configurar entorno de Windows
      uses: ilammy/msvc-dev-cmd@v1

    - name: Crear estructura y archivos desde cero
      run: |
        mkdir AppFolder -Force
        mkdir AppFolder\Assets -Force
        
        # Crear imagen transparente para los iconos obligatorios
        $bytes = [Convert]::FromBase64String("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=")
        [IO.File]::WriteAllBytes("AppFolder\Assets\logo.png", $bytes)
        
        # Crear el manifiesto de la aplicación web con el nombre correcto (AppxManifest.xml)
        $manifest = @"
        <?xml version="1.0" encoding="utf-8"?>
        <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10">
          <Identity Name="XboxCloudApp" Publisher="CN=XboxCloudApp" Version="1.0.0.0" Architecture="neutral" />
          <Properties>
            <DisplayName>Xbox Cloud</DisplayName>
            <PublisherDisplayName>David</PublisherDisplayName>
            <Logo>Assets\logo.png</Logo>
          </Properties>
          <Dependencies>
            <TargetDeviceFamily Name="Windows.Universal" MinVersion="10.0.17763.0" MaxVersionTested="10.0.19041.0" />
          </Dependencies>
          <Resources>
            <Resource Language="es-ES"/>
          </Resources>
          <Applications>
            <Application Id="App" StartPage="https://www.xbox.com/play">
              <uap:VisualElements DisplayName="Xbox Cloud Gaming" Description="Web wrapper" BackgroundColor="#107C10" Square150x150Logo="Assets\logo.png" Square44x44Logo="Assets\logo.png">
              </uap:VisualElements>
              <uap:ApplicationContentUriRules>
                <uap:Rule Match="https://www.xbox.com/" Type="include" WindowsRuntimeAccess="all" />
                <uap:Rule Match="https://login.live.com/" Type="include" WindowsRuntimeAccess="none" />
              </uap:ApplicationContentUriRules>
            </Application>
          </Applications>
          <Capabilities>
            <Capability Name="internetClient" />
          </Capabilities>
        </Package>
        "@
        Set-Content -Path "AppFolder\AppxManifest.xml" -Value $manifest -Encoding UTF8

    - name: Empaquetar App
      run: makeappx pack /d AppFolder /p XboxCloudApp.appx

    - name: Generar Certificado Digital
      run: |
        $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=XboxCloudApp" -KeyUsage DigitalSignature -FriendlyName "XboxCloudApp" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
        $pwd = ConvertTo-SecureString "1234" -Force -AsPlainText
        Export-PfxCertificate -Cert $cert -FilePath "XboxCloudApp.pfx" -Password $pwd
        Export-Certificate -Cert $cert -FilePath "XboxCloudApp.cer"

    - name: Firmar App
      run: signtool sign /fd SHA256 /a /f XboxCloudApp.pfx /p 1234 XboxCloudApp.appx

    - name: Subir Archivos Listos
      uses: actions/upload-artifact@v4
      with:
        name: Xbox-App-Terminada
        path: |
          XboxCloudApp.appx
          XboxCloudApp.cer
          
