name: Crear App Xbox Cloud WebView2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

    - name: Crear proyecto UWP
      shell: pwsh
      run: |

        New-Item -ItemType Directory -Force -Path "XboxCloudApp"
        New-Item -ItemType Directory -Force -Path "XboxCloudApp\Assets"

        # ==========================================================
        # PROJECT
        # ==========================================================

        @"
<Project ToolsVersion="15.0" DefaultTargets="Build"
  xmlns="http://schemas.microsoft.com/developer/msbuild/2003">

  <Import Project="`$(MSBuildExtensionsPath)\`$(MSBuildToolsVersion)\Microsoft.Common.props"
          Condition="Exists('`$(MSBuildExtensionsPath)\`$(MSBuildToolsVersion)\Microsoft.Common.props')" />

  <PropertyGroup>
    <Configuration Condition=" '`$(Configuration)' == '' ">Debug</Configuration>
    <Platform Condition=" '`$(Platform)' == '' ">x86</Platform>

    <ProjectGuid>{8D3E5E35-2E43-4A13-9D76-7D6E9F9A1001}</ProjectGuid>

    <OutputType>AppContainerExe</OutputType>
    <AppDesignerFolder>Properties</AppDesignerFolder>

    <RootNamespace>XboxCloudApp</RootNamespace>
    <AssemblyName>XboxCloudApp</AssemblyName>

    <DefaultLanguage>es-ES</DefaultLanguage>

    <TargetPlatformIdentifier>UAP</TargetPlatformIdentifier>
    <TargetPlatformVersion>10.0.19041.0</TargetPlatformVersion>
    <TargetPlatformMinVersion>10.0.17763.0</TargetPlatformMinVersion>

    <MinimumVisualStudioVersion>16.0</MinimumVisualStudioVersion>

    <AppxPackageSigningEnabled>false</AppxPackageSigningEnabled>

    <RestoreProjectStyle>PackageReference</RestoreProjectStyle>

    <Platforms>x86;x64;ARM;ARM64</Platforms>
  </PropertyGroup>

  <PropertyGroup Condition="'`$(Platform)'=='x86'">
    <PlatformTarget>x86</PlatformTarget>
  </PropertyGroup>

  <PropertyGroup Condition="'`$(Platform)'=='x64'">
    <PlatformTarget>x64</PlatformTarget>
  </PropertyGroup>

  <PropertyGroup Condition="'`$(Platform)'=='ARM64'">
    <PlatformTarget>ARM64</PlatformTarget>
  </PropertyGroup>

  <ItemGroup>
    <PackageReference Include="Microsoft.Web.WebView2"
                      Version="1.0.3537.50" />
  </ItemGroup>

  <ItemGroup>
    <ApplicationDefinition Include="App.xaml">
      <Generator>MSBuild:Compile</Generator>
      <SubType>Designer</SubType>
    </ApplicationDefinition>

    <Page Include="MainPage.xaml">
      <Generator>MSBuild:Compile</Generator>
      <SubType>Designer</SubType>
    </Page>

    <Compile Include="App.xaml.cs">
      <DependentUpon>App.xaml</DependentUpon>
    </Compile>

    <Compile Include="MainPage.xaml.cs">
      <DependentUpon>MainPage.xaml</DependentUpon>
    </Compile>

    <Compile Include="Properties\AssemblyInfo.cs" />

    <Content Include="Assets\logo.png" />
    <None Include="packages.config" />
  </ItemGroup>

  <Import Project="`$(MSBuildToolsPath)\Microsoft.CSharp.targets" />

  <Import Project="`$(MSBuildExtensionsPath)\Microsoft\WindowsXaml\v``$(VisualStudioVersion)\Microsoft.Windows.UI.Xaml.CSharp.targets"
          Condition="Exists('`$(MSBuildExtensionsPath)\Microsoft\WindowsXaml\v``$(VisualStudioVersion)\Microsoft.Windows.UI.Xaml.CSharp.targets')" />

</Project>
"@ | Set-Content "XboxCloudApp\XboxCloudApp.csproj" -Encoding UTF8


        # ==========================================================
        # APP.XAML
        # ==========================================================

        @"
<Application
    x:Class="XboxCloudApp.App"
    xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
    xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml">

    <Application.Resources>
    </Application.Resources>

</Application>
"@ | Set-Content "XboxCloudApp\App.xaml" -Encoding UTF8


        # ==========================================================
        # APP.XAML.CS
        # ==========================================================

        @"
using System;
using Windows.ApplicationModel;
using Windows.ApplicationModel.Activation;
using Windows.UI.Xaml;

namespace XboxCloudApp
{
    sealed partial class App : Application
    {
        public App()
        {
            this.InitializeComponent();
            this.Suspending += OnSuspending;
        }

        protected override void OnLaunched(LaunchActivatedEventArgs e)
        {
            Frame rootFrame = Window.Current.Content as Frame;

            if (rootFrame == null)
            {
                rootFrame = new Frame();
                Window.Current.Content = rootFrame;
            }

            if (rootFrame.Content == null)
            {
                rootFrame.Navigate(typeof(MainPage));
            }

            Window.Current.Activate();
        }

        private void OnSuspending(
            object sender,
            SuspendingEventArgs e)
        {
        }
    }
}
"@ | Set-Content "XboxCloudApp\App.xaml.cs" -Encoding UTF8


        # ==========================================================
        # MAIN PAGE XAML
        # ==========================================================

        @"
<Page
    x:Class="XboxCloudApp.MainPage"
    xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
    xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"
    xmlns:wv2="using:Microsoft.UI.Xaml.Controls">

    <Grid Background="Black">

        <wv2:WebView2
            x:Name="Browser"
            HorizontalAlignment="Stretch"
            VerticalAlignment="Stretch" />

    </Grid>

</Page>
"@ | Set-Content "XboxCloudApp\MainPage.xaml" -Encoding UTF8


        # ==========================================================
        # MAIN PAGE C#
        # ==========================================================

        @"
using System;
using System.Threading.Tasks;
using Windows.UI.Xaml;
using Windows.UI.Xaml.Controls;
using Microsoft.Web.WebView2.Core;

namespace XboxCloudApp
{
    public sealed partial class MainPage : Page
    {
        private bool initialized = false;

        public MainPage()
        {
            this.InitializeComponent();
            this.Loaded += MainPage_Loaded;
        }

        private async void MainPage_Loaded(
            object sender,
            RoutedEventArgs e)
        {
            if (initialized)
                return;

            initialized = true;

            try
            {
                await Browser.EnsureCoreWebView2Async();

                Browser.CoreWebView2.Settings.AreDefaultContextMenusEnabled = false;
                Browser.CoreWebView2.Settings.AreDevToolsEnabled = false;
                Browser.CoreWebView2.Settings.IsStatusBarEnabled = false;
                Browser.CoreWebView2.Settings.IsZoomControlEnabled = false;

                Browser.CoreWebView2.NewWindowRequested +=
                    CoreWebView2_NewWindowRequested;

                Browser.CoreWebView2.NavigationStarting +=
                    CoreWebView2_NavigationStarting;

                Browser.CoreWebView2.NavigationCompleted +=
                    CoreWebView2_NavigationCompleted;

                Browser.CoreWebView2.Navigate(
                    "https://www.xbox.com/play");
            }
            catch (Exception ex)
            {
                System.Diagnostics.Debug.WriteLine(
                    "WebView2 initialization error: " + ex);
            }
        }

        private void CoreWebView2_NewWindowRequested(
            object sender,
            CoreWebView2NewWindowRequestedEventArgs e)
        {
            e.Handled = true;

            if (e.Uri != null &&
                !string.IsNullOrWhiteSpace(e.Uri))
            {
                Browser.CoreWebView2.Navigate(e.Uri);
            }
        }

        private void CoreWebView2_NavigationStarting(
            object sender,
            CoreWebView2NavigationStartingEventArgs e)
        {
            System.Diagnostics.Debug.WriteLine(
                "Navigation: " + e.Uri);
        }

        private void CoreWebView2_NavigationCompleted(
            object sender,
            CoreWebView2NavigationCompletedEventArgs e)
        {
            System.Diagnostics.Debug.WriteLine(
                "Navigation completed: " +
                e.IsSuccess +
                " Status=" +
                e.WebErrorStatus);
        }
    }
}
"@ | Set-Content "XboxCloudApp\MainPage.xaml.cs" -Encoding UTF8


